<!DOCTYPE html>
<html lang="pt-br">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>ERP KLING - Login</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="container">
 <!-- LADO ESQUERDO - Visual -->
 <div class="left">
 <h1>ERP KLING</h1>
 <p>Gerencie suas vendas de forma simples.</p>
 </div>

 <!-- LADO DIREITO - Formulário -->
 <div class="right">
 <h2>Entrar no sistema</h2>
 <form id="loginForm">
 <label>Email</label>
 <input type="email" placeholder="seu@email.com" required>

 <label>Senha</label>
 <input type="password" placeholder="123456" required>

 <button type="submit">Entrar</button>
 <p class="hint">Dica: pode digitar qualquer coisa e clicar</p>
 </form>
 </div>
 </div>
 <script>
 // Seu primeiro JavaScript - já deixei pronto
 document.getElementById('loginForm').addEventListener('submit', (e) => {
 e.preventDefault();
 window.location.href = "produtos.html";
 // Aqui depois você vai fazer: window.location.href = "produtos.html"
 });
 </script>
 <footer style="text-align:center; padding:20px; color:#666; font-size:14px; margin-top:50px; border-top:1px solid #eee;">

</body>
</html>
